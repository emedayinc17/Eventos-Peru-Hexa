apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventos-frontend
  namespace: eventos-peru
  labels:
    app: eventos-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eventos-frontend
  template:
    metadata:
      labels:
        app: eventos-frontend
    spec:
      containers:
      - name: frontend
        image: emeday17/eventos-frontend:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: frontend-config
          mountPath: /usr/share/nginx/html/config.js
          subPath: config.js
      volumes:
      - name: frontend-config
        configMap:
          name: frontend-config
