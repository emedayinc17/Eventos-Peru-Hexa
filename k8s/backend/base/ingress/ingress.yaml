apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventos-api
  namespace: eventos-peru
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept, Origin, X-Requested-With"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    # For MVP we serve over plain HTTP only. Disable automatic SSL redirect
    # and hide any Strict-Transport-Security header coming from upstream so
    # browsers don't enforce HTTPS for this host.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-hide-headers: "Strict-Transport-Security"
spec:
  ingressClassName: public
  rules:
    - host: eventos.emeday.inc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eventos-frontend
                port:
                  number: 80
          # 🔹 TODO el tráfico normal pasa por el gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8000

          # 🔹 Acceso directo a cada servicio SOLO para docs/openapi
          - path: /catalogo
            pathType: Prefix
            backend:
              service:
                name: catalogo-service
                port:
                  number: 8020

          - path: /iam
            pathType: Prefix
            backend:
              service:
                name: iam-service
                port:
                  number: 8010

          - path: /proveedores
            pathType: Prefix
            backend:
              service:
                name: proveedores-service
                port:
                  number: 8030

          - path: /contratacion
            pathType: Prefix
            backend:
              service:
                name: contratacion-service
                port:
                  number: 8040
