apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventos-api
  namespace: eventos-peru
  annotations:
    kubernetes.io/ingress.class: public
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept, Origin, X-Requested-With"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-hide-headers: "Strict-Transport-Security"
spec:
  ingressClassName: public
  rules:
    - host: eventos.emeday.inc
      http:
        paths:
          # ============================================================
          # 🔵 TODO LO QUE SEA /api/** → GATEWAY
          # ============================================================
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8000

          # ============================================================
          # 🔵 ACCESO DIRECTO A MICROSERVICIOS (Swagger/docs)
          #    Esto NO lo usa el frontend, solo tú como dev.
          # ============================================================
          - path: /iam
            pathType: Prefix
            backend:
              service:
                name: iam-service
                port:
                  number: 8010

          - path: /catalogo
            pathType: Prefix
            backend:
              service:
                name: catalogo-service
                port:
                  number: 8020

          - path: /proveedores
            pathType: Prefix
            backend:
              service:
                name: proveedores-service
                port:
                  number: 8030

          - path: /contratacion
            pathType: Prefix
            backend:
              service:
                name: contratacion-service
                port:
                  number: 8040
