# =========================
# PROVEEDORES
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proveedores-service
  namespace: eventos-peru
  labels:
    app: proveedores-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proveedores-service
  template:
    metadata:
      labels:
        app: proveedores-service
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "eventos-peru-role"
        vault.hashicorp.com/agent-inject-secret-config: "kv/data/eventos-peru/proveedores"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "kv/data/eventos-peru/proveedores" -}}
          APP_ENV="{{ .Data.data.APP_ENV }}"
          DB_HOST="{{ .Data.data.DB_HOST }}"
          DB_PORT="{{ .Data.data.DB_PORT }}"
          DB_USER="{{ .Data.data.DB_USER }}"
          DB_PASS="{{ .Data.data.DB_PASS }}"
          DB_NAME="{{ .Data.data.DB_NAME }}"
          SCHEMA_PROVEEDORES="{{ .Data.data.SCHEMA_PROVEEDORES }}"
          SCHEMA_IAM="{{ .Data.data.SCHEMA_IAM }}"
          SCHEMA_CATALOGO="{{ .Data.data.SCHEMA_CATALOGO }}"
          SCHEMA_CONTRATACION="{{ .Data.data.SCHEMA_CONTRATACION }}"
          SCHEMA_PAQUETES="{{ .Data.data.SCHEMA_PAQUETES }}"
          JWT_SECRET="{{ .Data.data.JWT_SECRET }}"
          JWT_ALG="{{ .Data.data.JWT_ALG }}"
          ACCESS_TOKEN_EXPIRE_MINUTES="{{ .Data.data.ACCESS_TOKEN_EXPIRE_MINUTES }}"
          {{- end }}
    spec:
      serviceAccountName: app-eventos
      containers:
        - name: app
          image: eventos-proveedores
          imagePullPolicy: Always
          env:
            - name: BASE_PATH
              value: "/proveedores"
            - name: PYTHONPATH
              value: "/app/libs/shared:/app/services/proveedores-service"
            - name: PORT
              value: "8030"
            - name: EV_SETTINGS_ENV_FILE
              value: "/vault/secrets/config"
            - name: VAULT_ENABLED
              value: "true"
          command: ["uvicorn"]
          args:
            - app.entrypoints.fastapi.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8030"
            - --app-dir
            - /app/services/proveedores-service
          ports:
            - name: http
              containerPort: 8030
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              # 👀 si tu FastAPI expone /health (como IAM y contratacion),
              # es mejor usar /health para evitar 404 en el healthcheck.
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: proveedores-service
  namespace: eventos-peru
spec:
  selector:
    app: proveedores-service
  ports:
    - name: http
      port: 8030
      targetPort: 8030
