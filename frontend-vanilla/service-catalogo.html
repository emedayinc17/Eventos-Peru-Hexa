<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo — Eventos Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/theme-airbnb-lite.css">
  <style>.app-container{max-width:1080px}</style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white border-bottom">
    <div class="container app-container">
      <a class="navbar-brand fw-bold" href="index.html">Eventos Perú</a>
      <div class="ms-auto">
        <a class="btn btn-outline-secondary btn-sm" href="index.html">Volver</a>
      </div>
    </div>
  </nav>

  <main class="container app-container py-4">
    <!-- Catálogo (copiado desde index para edición aislada) -->
    <section id="view-catalogo">
      <div class="card shadow-sm mb-3">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
          <div>
            <h4 class="mb-0">Catálogo de paquetes</h4>
            <small class="text-muted">Explora los paquetes y servicios disponibles.</small>
          </div>
          <div class="text-end">
            <button class="btn btn-outline-secondary btn-sm" id="btn-catalogo-reload">
              <i class="bi bi-arrow-clockwise me-1"></i>Recargar
            </button>
          </div>
        </div>
      </div>

      <div id="catalogo-alert" class="alert d-none" role="alert"></div>

        <div id="catalogo-carousel-wrapper" class="d-none mb-4">
          <div id="catalogoCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner" id="catalogo-carousel-inner"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#catalogoCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#catalogoCarousel" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Siguiente</span>
            </button>
          </div>
        </div>

      <div id="catalogo-filters" class="mb-3"></div>
      <div id="catalogo-cards" class="row g-3"></div>

      <div id="catalogo-meta" class="row g-3 mt-3">
        <div class="col-12 col-md-6">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-header bg-white border-0 py-2 px-3">
              <button class="meta-toggle-btn w-100 text-start btn btn-link text-decoration-none d-flex justify-content-between align-items-center collapsed" data-bs-toggle="collapse" data-bs-target="#meta-tipos-collapse" aria-expanded="false" aria-controls="meta-tipos-collapse">
                <span class="fw-semibold">Tipos de evento</span>
                <i class="bi bi-chevron-up small meta-chevron"></i>
              </button>
            </div>
            <div id="meta-tipos-collapse" class="collapse">
              <div class="card-body pt-0">
                <ul id="catalogo-tipos-list" class="list-unstyled small mb-0"></ul>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-header bg-white border-0 py-2 px-3">
              <button class="meta-toggle-btn w-100 text-start btn btn-link text-decoration-none d-flex justify-content-between align-items-center collapsed" data-bs-toggle="collapse" data-bs-target="#meta-servicios-collapse" aria-expanded="false" aria-controls="meta-servicios-collapse">
                <span class="fw-semibold">Servicios por tipo</span>
                <i class="bi bi-chevron-up small meta-chevron"></i>
              </button>
            </div>
            <div id="meta-servicios-collapse" class="collapse">
              <div class="card-body pt-0">
                <div id="catalogo-servicios-list" class="small"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
