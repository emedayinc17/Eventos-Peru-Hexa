<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contratación — Eventos Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/theme-airbnb-lite.css">
  <style>.app-container{max-width:1080px}</style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white border-bottom">
    <div class="container app-container">
      <a class="navbar-brand fw-bold" href="index.html">Eventos Perú</a>
      <div class="ms-auto">
        <a class="btn btn-outline-secondary btn-sm" href="index.html">Volver</a>
      </div>
    </div>
  </nav>

  <main class="container app-container py-4">
    <section id="view-contratacion">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h5 class="mb-1" id="contratacion-title">Mis Pedidos</h5>
              <small class="text-muted" id="contratacion-subtitle">Revisa el estado y detalles de tus pedidos contratados.</small>
            </div>
            <div class="text-end">
              <button class="btn btn-outline-primary btn-sm" id="btn-refresh-pedidos"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-4" id="contratacion-user-stats">
        <div class="col-md-3"><div class="card bg-primary text-white"><div class="card-body py-3"><div class="d-flex align-items-center"><div class="me-3"><i class="bi bi-cart-check fs-4"></i></div><div><h6 class="mb-0">Total Pedidos</h6><span class="h5 mb-0" id="stats-total">0</span></div></div></div></div></div>
        <div class="col-md-3"><div class="card bg-success text-white"><div class="card-body py-3"><div class="d-flex align-items-center"><div class="me-3"><i class="bi bi-check-circle fs-4"></i></div><div><h6 class="mb-0">Confirmados</h6><span class="h5 mb-0" id="stats-confirmados">0</span></div></div></div></div></div>
        <div class="col-md-3"><div class="card bg-warning text-dark"><div class="card-body py-3"><div class="d-flex align-items-center"><div class="me-3"><i class="bi bi-clock fs-4"></i></div><div><h6 class="mb-0">Pendientes</h6><span class="h5 mb-0" id="stats-pendientes">0</span></div></div></div></div></div>
        <div class="col-md-3"><div class="card bg-secondary text-white"><div class="card-body py-3"><div class="d-flex align-items-center"><div class="me-3"><i class="bi bi-x-circle fs-4"></i></div><div><h6 class="mb-0">Cancelados</h6><span class="h5 mb-0" id="stats-cancelados">0</span></div></div></div></div></div>
      </div>

      <div class="card" id="contratacion-client-list-card">
        <div class="card-header bg-light"><div class="row align-items-center"><div class="col-md-6"><h6 class="mb-0">Historial de Pedidos</h6></div><div class="col-md-6 text-end"><select class="form-select form-select-sm w-auto d-inline-block" id="filter-status"><option value="">Todos los estados</option><option value="0">Borrador</option><option value="1">Cotizado</option><option value="2">Aprobado</option><option value="3">Asignado</option><option value="4">Cerrado</option><option value="5">Cancelado</option></select></div></div></div>
        <div class="card-body p-0"><div id="contratacion-mis-pedidos" class="list-group list-group-flush"></div><div id="contratacion-empty" class="text-center py-5 d-none"><i class="bi bi-cart-x text-muted fs-1"></i><p class="text-muted mt-2">No tienes pedidos registrados</p><a href="service-catalogo.html" class="btn btn-primary btn-sm">Explorar Catálogo</a></div></div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
