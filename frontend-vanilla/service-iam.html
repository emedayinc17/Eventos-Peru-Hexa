<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IAM / Perfil — Eventos Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/theme-airbnb-lite.css">
  <style>.app-container{max-width:1080px}</style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white border-bottom">
    <div class="container app-container">
      <a class="navbar-brand fw-bold" href="index.html">Eventos Perú</a>
      <div class="ms-auto">
        <a class="btn btn-outline-secondary btn-sm" href="index.html">Volver</a>
      </div>
    </div>
  </nav>

  <main class="container app-container py-4">
    <section id="view-login">
      <div class="d-flex justify-content-center align-items-center" style="min-height:320px">
        <div class="card login-card shadow-sm" style="max-width:520px;width:100%">
          <div class="card-header p-4 text-white" style="background:linear-gradient(90deg,var(--primary-500),var(--primary-400));border-radius:0.6rem 0.6rem 0 0;">
            <div class="d-flex align-items-center gap-3">
              <div class="login-avatar rounded-circle bg-white text-primary d-flex align-items-center justify-content-center" style="width:56px;height:56px;font-weight:700;">EP</div>
              <div>
                <h5 class="mb-0">Iniciar sesión</h5>
                <small class="small-muted">Accede con tu cuenta de Eventos Perú</small>
              </div>
            </div>
          </div>
          <div class="card-body p-4">
            <form id="login-form">
              <div class="mb-3">
                <label class="form-label visually-hidden">Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                  <input class="form-control form-control-lg" type="email" name="email" required placeholder="usuario@eventos.pe" />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label visually-hidden">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                  <input class="form-control form-control-lg" type="password" name="password" required placeholder="Contraseña" />
                </div>
              </div>
              <div class="d-grid mb-2">
                <button class="btn btn-primary btn-lg" type="submit">Entrar</button>
              </div>
              <div class="d-flex gap-2 justify-content-center mt-2">
                <button type="button" id="quicklogin-client" class="btn btn-outline-primary btn-sm">Cliente</button>
                <button type="button" id="quicklogin-admin" class="btn btn-outline-secondary btn-sm">Admin</button>
              </div>
              <div class="text-center mt-3 small text-muted">¿No tienes cuenta? <a href="#" id="open-public-register">Regístrate</a></div>
            </form>
            <div class="text-danger small mt-2" id="login-error"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="view-me" class="mt-4">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary-subtle border-0 py-4">
          <div class="d-flex align-items-center gap-3">
            <div id="me-avatar" class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:56px;height:56px;font-weight:600;">?</div>
            <div>
              <h5 class="mb-0" id="me-name">—</h5>
              <div class="text-secondary small" id="me-email">—</div>
            </div>
            <span class="ms-auto badge rounded-pill text-bg-primary" id="me-role">—</span>
          </div>
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <div class="list-group list-group-flush">
                <div class="list-group-item px-0 d-flex justify-content-between"><span class="text-secondary"><i class="bi bi-person-badge me-2"></i>ID</span><code class="small text-body-secondary" id="me-id"></code></div>
                <div class="list-group-item px-0 d-flex justify-content-between"><span class="text-secondary"><i class="bi bi-telephone me-2"></i>Teléfono</span><span id="me-telefono">—</span></div>
                <div class="list-group-item px-0 d-flex justify-content-between"><span class="text-secondary"><i class="bi bi-shield-check me-2"></i>Estado</span><span id="me-status" class="badge rounded-pill text-bg-success">—</span></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="p-3 bg-light rounded-3 border"><div class="d-flex align-items-center mb-2"><i class="bi bi-info-circle me-2"></i> Resumen</div><div class="small text-secondary">Usuario autenticado vía JWT. Usa el menú superior para navegar.</div></div>
            </div>
          </div>
          <pre id="me-json" class="d-none bg-light p-3 mt-3" style="white-space: pre-wrap;"></pre>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
