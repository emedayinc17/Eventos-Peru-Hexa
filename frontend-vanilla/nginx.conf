server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend SPA: siempre devolver index.html y dejar que el router del navegador maneje las rutas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos estáticos (js/css/img) con cache básica
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri $uri/ /index.html;
    }

    # Gzip básico
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml application/font-woff application/font-woff2 image/svg+xml;
    gzip_min_length 256;
}
