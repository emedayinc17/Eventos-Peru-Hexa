<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proveedores — Eventos Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/theme-airbnb-lite.css">
  <style>.app-container{max-width:1080px}</style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white border-bottom">
    <div class="container app-container">
      <a class="navbar-brand fw-bold" href="index.html">Eventos Perú</a>
      <div class="ms-auto">
        <a class="btn btn-outline-secondary btn-sm" href="index.html">Volver</a>
      </div>
    </div>
  </nav>

  <main class="container app-container py-4">
    <section id="view-proveedores">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title mb-3">
            <i class="bi bi-search me-2"></i>Buscar Proveedores Disponibles
          </h5>
          <form id="buscar-form" class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Servicio ID</label>
              <input class="form-control" type="text" name="servicio_id" required placeholder="ej: id_service" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Fecha</label>
              <input class="form-control" type="date" name="fecha" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Límite</label>
              <input class="form-control" type="number" name="limit" value="50" min="1" max="200" />
            </div>
            <div class="col-12">
              <button class="btn btn-primary" type="submit"><i class="bi bi-search me-2"></i>Buscar</button>
              <button class="btn btn-outline-secondary" type="reset">Limpiar</button>
            </div>
          </form>
          <div class="text-danger small mt-3" id="buscar-error"></div>
        </div>
      </div>

      <div id="resultados-container">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h5 class="mb-0">Proveedores Disponibles</h5>
          <span class="badge bg-primary" id="resultados-count">0 resultados</span>
        </div>
        <div class="row g-3" id="proveedores-grid"></div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
