[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

markers =
    unit: Tests unitarios (rápidos, sin dependencias externas)
    integration: Tests de integración (requiere servicios corriendo)
    e2e: Tests end-to-end (flujos completos)
    security: Tests de seguridad (autenticación, autorización)
    slow: Tests lentos (>1 segundo)
    smoke: Tests de humo (críticos para validación rápida)

# Cobertura
[coverage:run]
source = services
omit = 
    */test/*
    */tests/*
    */__pycache__/*
    */venv/*
    */Lib/*
    */Scripts/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
