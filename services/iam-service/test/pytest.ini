[pytest]
# Only look for tests inside the service's `test/` directory.
testpaths = test

# Add the service root to PYTHONPATH during tests (allows importing `app` package).
pythonpath = .

# Ignore common virtualenv and distribution folders that may exist under the repo root
# (prevents pytest from collecting tests from e.g. Lib/site-packages inside the repo).
norecursedirs = .git .hg .venv venv env Lib site-packages __pycache__
