apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iam-services-frontend
spec:
  destination:
    name: ''
    namespace: eventos-peru
    server: https://kubernetes.default.svc
  source:
    path: services/iam-service/frontend-vanilla/k8s
    repoURL: https://github.com/emedayinc17/Eventos-Peru-Hexa.git
    targetRevision: emeday
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - PruneLast=true
