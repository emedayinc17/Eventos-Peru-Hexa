apiVersion: v1
kind: ConfigMap
metadata:
  name: iam-frontend-config
  namespace: eventos-peru
data:
  # Archivo que se servirá como /config.js en el frontend
  config.js: |
    // Configuración del frontend IAM (entorno Kubernetes)
    // Apunta al backend deployado en el mismo dominio
    window.API_BASE = "https://eventos.emeday.inc/iam/iam";
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-frontend
  namespace: eventos-peru
  labels:
    app: iam-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iam-frontend
  template:
    metadata:
      labels:
        app: iam-frontend
    spec:
      volumes:
        - name: iam-frontend-config
          configMap:
            name: iam-frontend-config
            items:
              - key: config.js
                path: config.js
      containers:
        - name: iam-frontend
          # 👉 Cambia el tag si usas otra versión
          image: emeday17/eventos-iam-frontend:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: iam-frontend-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: iam-frontend
  namespace: eventos-peru
  labels:
    app: iam-frontend
spec:
  selector:
    app: iam-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iam-frontend
  namespace: eventos-peru
  annotations:
    kubernetes.io/ingress.class: public   # ← ESTE ES EL ACTIVO
spec:
  tls:
    - hosts:
        - eventos.emeday.inc
      secretName: eventos-emeday-inc-tls
  rules:
    - host: eventos.emeday.inc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iam-frontend
                port:
                  number: 80
