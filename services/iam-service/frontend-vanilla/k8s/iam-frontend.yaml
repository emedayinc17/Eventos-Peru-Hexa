apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-frontend
  namespace: eventos-peru
  labels:
    app: iam-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iam-frontend
  template:
    metadata:
      labels:
        app: iam-frontend
    spec:
      containers:
        - name: iam-frontend
          image: emeday17/eventos-iam-frontend:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: iam-frontend
  namespace: eventos-peru
  labels:
    app: iam-frontend
spec:
  selector:
    app: iam-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iam-frontend
  namespace: eventos-peru
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
    - hosts:
        - eventos.emeday.inc
      secretName: eventos-emeday-inc-tls   # Ajusta al nombre real de tu secret TLS
  rules:
    - host: eventos.emeday.inc
      http:
        paths:
          - path: /iam-ui(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: iam-frontend
                port:
                  number: 80
