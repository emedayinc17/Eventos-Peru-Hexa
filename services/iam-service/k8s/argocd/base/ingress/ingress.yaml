apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventos-api
  namespace: eventos-peru
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept, Origin, X-Requested-With"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: public  # ← CAMBIADO: 'public' para MicroK8s
  rules:
    - host: eventos.emeday.inc
      http:
        paths:
          # IAM - todas las rutas /iam/...
          - path: /iam(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: iam-service
                port:
                  number: 8010  # ← CAMBIADO: puerto 8010 (donde escucha tu app)

          # CATALOGO
          - path: /catalogo(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: catalogo-service
                port:
                  number: 80

          # PROVEEDORES
          - path: /proveedores(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: proveedores-service
                port:
                  number: 80

          # CONTRATACION
          - path: /contratacion(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: contratacion-service
                port:
                  number: 80