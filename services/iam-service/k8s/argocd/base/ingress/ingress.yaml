apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventos-api
  namespace: eventos-peru
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Reescribe "/<svc>/<lo-que-sea>" -> "/<lo-que-sea>" en el backend
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # CORS básico
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept, Origin, X-Requested-With"
    # Límite simple
    nginx.ingress.kubernetes.io/limit-rps: "20"
    # Para MicroK8s usa 'public' en lugar de 'nginx'
    kubernetes.io/ingress.class: "public"
spec:
  ingressClassName: public  # ← CAMBIADO: MicroK8s usa 'public' no 'nginx'
  rules:
    - host: eventos.emeday.inc
      http:
        paths:
          # Endpoint específico para openapi.json
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: iam-service
                port:
                  number: 8010  # ← CAMBIADO: usa el puerto correcto (8010 no 80)

          # IAM - Ruta con regex
          - path: /iam(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: iam-service
                port:
                  number: 8010  # ← CAMBIADO: 8010

          # CATALOGO
          - path: /catalogo(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: catalogo-service
                port:
                  number: 80

          # PROVEEDORES
          - path: /proveedores(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: proveedores-service
                port:
                  number: 80

          # CONTRATACION
          - path: /contratacion(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: contratacion-service
                port:
                  number: 80