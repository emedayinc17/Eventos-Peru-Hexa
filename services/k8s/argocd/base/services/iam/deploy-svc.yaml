# =========================
# IAM
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-service
  namespace: eventos-peru
  labels: { app: iam-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: iam-service }
  template:
    metadata:
      labels: { app: iam-service }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "eventos-peru-role"
        vault.hashicorp.com/agent-inject-secret-config: "kv/data/eventos-peru/iam"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "kv/data/eventos-peru/iam" -}}
          APP_ENV={{ .Data.data.APP_ENV }}
          DB_HOST={{ .Data.data.DB_HOST }}
          DB_PORT={{ .Data.data.DB_PORT }}
          DB_USER={{ .Data.data.DB_USER }}
          DB_PASS={{ .Data.data.DB_PASS }}
          DB_NAME={{ .Data.data.DB_NAME }}
          JWT_SECRET={{ .Data.data.JWT_SECRET }}
          ACCESS_TOKEN_EXPIRE_MINUTES={{ .Data.data.ACCESS_TOKEN_EXPIRE_MINUTES }}
          {{- end }}
    spec:
      serviceAccountName: app-eventos
      containers:
        - name: app
          image: eventos-iam:0.1.0
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args:
            - "-c"
              - |
              # Cargar secrets de Vault (Alpine compatible) si existen
              if [ -f /vault/secrets/config ]; then
                . /vault/secrets/config
              fi
              # Forzar variables de entorno para sobreescribir los valores hardcodeados
              export DB_HOST="${DB_HOST}"
              export DB_PORT="${DB_PORT}"
              export DB_USER="${DB_USER}"
              export DB_PASS="${DB_PASS}"
              export DB_NAME="${DB_NAME}"
              # Ejecutar la aplicación
              exec uvicorn app.entrypoints.fastapi.main:app --host 0.0.0.0 --port 8010 --root-path /iam
          env:
            - name: BASE_PATH
              value: "/iam"
            - name: UVICORN_ROOT_PATH
              value: "/iam"
          ports:
            - name: http
              containerPort: 8010
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet:
              path: /iam/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /iam/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: iam-service
  namespace: eventos-peru
spec:
  selector: { app: iam-service }
  ports:
    - name: http
      port: 8010
      targetPort: 8010
