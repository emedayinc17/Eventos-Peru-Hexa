# =========================
# CATALOGO
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-service
  namespace: eventos-peru
  labels: { app: catalogo-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalogo-service }
  template:
    metadata:
      labels: { app: catalogo-service }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "eventos-peru-role"
        vault.hashicorp.com/agent-inject-secret-config: "kv/data/eventos-peru/catalogo"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "kv/data/eventos-peru/catalogo" -}}
          APP_ENV={{ .Data.data.APP_ENV }}
          DB_HOST={{ .Data.data.DB_HOST }}
          DB_PORT={{ .Data.data.DB_PORT }}
          DB_USER={{ .Data.data.DB_USER }}
          DB_PASS={{ .Data.data.DB_PASS }}
          DB_NAME={{ .Data.data.DB_NAME }}
          JWT_SECRET={{ .Data.data.JWT_SECRET }}
          ACCESS_TOKEN_EXPIRE_MINUTES={{ .Data.data.ACCESS_TOKEN_EXPIRE_MINUTES }}
          {{- end }}
    spec:
      serviceAccountName: app-eventos
      containers:
        - name: app
          image: eventos-catalogo:0.1.0
          imagePullPolicy: Always
          env:
            - name: BASE_PATH
              value: "/catalogo"
            - name: PYTHONPATH
              value: "/app/libs/shared:/app/services/catalogo-service"
            - name: PORT
              value: "8020"
          command: ["uvicorn"]
          args:
            - app.entrypoints.fastapi.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8020"
            - --app-dir
            - /app/services/catalogo-service
          ports:
            - name: http
              containerPort: 8020
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /catalogo/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /catalogo/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo-service
  namespace: eventos-peru
spec:
  selector: { app: catalogo-service }
  ports:
    - name: http
      port: 8020
      targetPort: 8020