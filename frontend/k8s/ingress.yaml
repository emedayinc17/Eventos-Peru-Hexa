apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventos-peru-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: eventos-peru.local
    http:
      paths:
      # Frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      
      # IAM Service
      - path: /api/iam
        pathType: Prefix
        backend:
          service:
            name: iam-service
            port:
              number: 8010
      
      # Catálogo Service
      - path: /api/catalogo
        pathType: Prefix
        backend:
          service:
            name: catalogo-service
            port:
              number: 8020
      
      # Proveedores Service
      - path: /api/proveedores
        pathType: Prefix
        backend:
          service:
            name: proveedores-service
            port:
              number: 8030
      
      # Contratación Service
      - path: /api/contratacion
        pathType: Prefix
        backend:
          service:
            name: contratacion-service
            port:
              number: 8040
