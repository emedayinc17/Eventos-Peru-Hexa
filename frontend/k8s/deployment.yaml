apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
  labels:
    app: frontend
    tier: presentation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
      - name: frontend
        image: eventos-peru/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_IAM_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: VITE_IAM_URL
        - name: VITE_CATALOGO_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: VITE_CATALOGO_URL
        - name: VITE_PROVEEDORES_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: VITE_PROVEEDORES_URL
        - name: VITE_CONTRATACION_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: VITE_CONTRATACION_URL
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
