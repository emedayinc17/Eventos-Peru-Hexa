<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Eventos Perú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }

        .nav-link.active {
            background-color: #0d6efd;
            color: white !important;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Eventos Perú</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <span id="user-name">Usuario</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="btn-logout">Cerrar Sesión</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link active" href="#" onclick="loadView('home')">
                            🏠 Inicio
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-dark" href="#" onclick="loadView('catalogo')">
                            📦 Catálogo
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-dark" href="#" onclick="loadView('pedidos')">
                            📋 Mis Pedidos
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div id="main-content">
                    <!-- Dynamic Content -->
                    <h2>Bienvenido al Panel de Control</h2>
                    <p class="lead">Selecciona una opción del menú para comenzar.</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/adapters/http-adapter.js"></script>
    <script src="js/adapters/catalogo-service.js"></script>
    <script src="js/adapters/contratacion-service.js"></script>

    <script>
        // Lógica del Dashboard
        document.addEventListener('DOMContentLoaded', () => {
            SessionManager.requireAuth();

            const session = SessionManager.getSession();
            if (session.user) {
                document.getElementById('user-name').textContent = session.user.nombre_completo;
            }

            document.getElementById('btn-logout').addEventListener('click', (e) => {
                e.preventDefault();
                SessionManager.clearSession();
                window.location.href = Config.ROUTES.LOGIN;
            });
        });

        // Router simple para SPA dentro del dashboard
        async function loadView(viewName) {
            const contentDiv = document.getElementById('main-content');

            // Actualizar active class en sidebar
            document.querySelectorAll('.sidebar .nav-link').forEach(l => {
                l.classList.remove('active');
                l.classList.add('text-dark');
            });
            event.target.classList.add('active');
            event.target.classList.remove('text-dark');

            if (viewName === 'home') {
                contentDiv.innerHTML = `<h2>Bienvenido al Panel de Control</h2><p class="lead">Selecciona una opción del menú para comenzar.</p>`;
            } else if (viewName === 'catalogo') {
                await renderCatalogo(contentDiv);
            } else if (viewName === 'pedidos') {
                await renderPedidos(contentDiv);
            }
        }

        async function renderCatalogo(container) {
            container.innerHTML = '<h3>Catálogo de Paquetes</h3><div id="catalogo-list" class="row mt-4"><div class="spinner-border text-primary"></div> Cargando...</div>';

            try {
                const paquetes = await CatalogoService.getPaquetes();
                const listContainer = document.getElementById('catalogo-list');

                if (paquetes.length === 0) {
                    listContainer.innerHTML = '<div class="alert alert-info">No hay paquetes disponibles.</div>';
                    return;
                }

                let html = '';
                paquetes.forEach(p => {
                    html += `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">${p.nombre}</h5>
                                <p class="card-text text-muted small">${p.descripcion}</p>
                                <h4 class="text-primary fw-bold">S/ ${p.monto_total.toFixed(2)}</h4>
                            </div>
                            <div class="card-footer bg-white border-top-0">
                                <button class="btn btn-outline-primary w-100">Ver Detalles</button>
                            </div>
                        </div>
                    </div>`;
                });
                listContainer.innerHTML = html;

            } catch (error) {
                container.innerHTML = `<div class="alert alert-danger">Error al cargar catálogo: ${error.message}</div>`;
            }
        }

        async function renderPedidos(container) {
            container.innerHTML = '<h3>Mis Pedidos</h3><div id="pedidos-list" class="mt-4"><div class="spinner-border text-primary"></div> Cargando...</div>';

            try {
                const pedidos = await ContratacionService.getMisPedidos();
                const listContainer = document.getElementById('pedidos-list');

                if (pedidos.length === 0) {
                    listContainer.innerHTML = '<div class="alert alert-info">No tienes pedidos registrados.</div>';
                    return;
                }

                let html = '<div class="table-responsive"><table class="table table-hover border"><thead><tr><th>ID</th><th>Estado</th><th>Fecha</th><th>Total</th><th>Acciones</th></tr></thead><tbody>';

                pedidos.forEach(p => {
                    const badgeClass = p.estado === 'CONFIRMADO' ? 'bg-success' : p.estado === 'CANCELADO' ? 'bg-danger' : 'bg-warning text-dark';
                    html += `
                    <tr>
                        <td>#${p.id.substring(0, 8)}</td>
                        <td><span class="badge ${badgeClass}">${p.estado}</span></td>
                        <td>${new Date(p.created_at).toLocaleDateString()}</td>
                        <td>S/ ${p.monto_total.toFixed(2)}</td>
                        <td><button class="btn btn-sm btn-info text-white">Ver</button></td>
                    </tr>`;
                });

                html += '</tbody></table></div>';
                listContainer.innerHTML = html;

            } catch (error) {
                container.innerHTML = `<div class="alert alert-danger">Error al cargar pedidos: ${error.message}</div>`;
            }
        }
    </script>
</body>

</html>
